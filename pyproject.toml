[project]
name = "jev-benchmarks"
version = "0.1.0"
description = "Reproducible evaluations for Jev and Jev-like classifiers"
requires-python = ">=3.11"
dependencies = [
  "datasets==5.0.1",
  "python-dotenv==1.1.1",
  "typesafe-sdk==0.7.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
